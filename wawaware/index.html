<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WawaWare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
  <link rel="stylesheet" href="css/style.css?v=2026.10.02-7">
</head>
<body>
  <div id="app">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="menu" class="screen">
      <h1>WAWA<span>WARE</span></h1>
      <p class="tag">Des mini-jeux de 5 secondes. Enchaîne-les sans perdre tes 4 cœurs !</p>
      <div class="menu-row">
        <button id="btn-play" class="big">▶ SOLO</button>
        <button id="btn-multi" class="big multi">👥 MULTIJOUEUR</button>
      </div>
      <div class="menu-row">
        <button id="btn-gallery">🖼️ Galerie</button>
        <button id="btn-mic">🎤 Activer le micro</button>
        <button id="btn-settings">⚙️ Réglages</button>
      </div>
      <div id="mic-panel" class="hidden">
        <div class="mic-row">
          <span>🎤</span>
          <div class="meter"><div id="mic-meter"></div></div>
          <label>Sensibilité <input type="range" id="mic-sens" min="0.4" max="2.5" step="0.1" value="1"></label>
        </div>
        <div class="mic-row small">🗣️ Entendu : <b id="voice-heard">—</b></div>
      </div>
      <p id="mic-status" class="tag small"></p>
      <p class="tag small">Échap = retour au menu</p>
    </div>

    <div id="settings" class="screen hidden">
      <h2>RÉGLAGES</h2>
      <div class="panel">
        <label class="field">🔊 Bruitages <input type="range" data-vol="sfx" min="0" max="1" step="0.05"> <b data-vol-val="sfx"></b></label>
        <label class="field">🎵 Musique <input type="range" data-vol="music" min="0" max="1" step="0.05"> <b data-vol-val="music"></b></label>
        <label class="field">❤️ Cœurs en solo <select id="solo-coeurs"></select></label>
        <div class="field">🖱️ Mon curseur <span class="swatches" data-swatches></span></div>
      </div>
      <button id="btn-settings-back" class="small">← Menu</button>
    </div>

    <div id="lobby" class="screen hidden">
      <h2>MULTIJOUEUR</h2>
      <div id="lobby-join" class="panel">
        <label class="field">Ton pseudo <input id="pseudo" maxlength="12" autocomplete="off"></label>
        <div class="field">Ta couleur <span class="swatches" data-swatches></span></div>
        <button id="btn-create" class="big">✨ Créer une salle</button>
        <div class="join-row">
          <input id="code-salle" maxlength="4" placeholder="CODE" autocomplete="off">
          <button id="btn-join">Rejoindre</button>
        </div>
        <p id="lobby-msg" class="tag small"></p>
      </div>
      <div id="lobby-room" class="panel hidden">
        <div class="room-head">
          <span>SALLE</span> <b id="room-code">----</b>
          <button id="btn-copy" class="small">🔗 Copier le lien</button>
        </div>
        <ul id="room-players"></ul>
        <div class="field">Ta couleur <span class="swatches" data-swatches></span></div>
        <label class="field check"><input type="checkbox" id="chk-micro"> Inclure les mini-jeux au micro (chacun active son micro)</label>
        <label class="field">❤️ Cœurs par joueur <select id="sel-coeurs"></select></label>
        <button id="btn-launch" class="big">▶ LANCER LA PARTIE</button>
        <p id="room-msg" class="tag small"></p>
        <button id="btn-leave" class="small">Quitter la salle</button>
      </div>
      <div class="vol-row">
        <label>🔊 <input type="range" data-vol="sfx" min="0" max="1" step="0.05"> <b data-vol-val="sfx"></b></label>
        <label>🎵 <input type="range" data-vol="music" min="0" max="1" step="0.05"> <b data-vol-val="music"></b></label>
      </div>
      <button id="btn-lobby-back" class="small">← Menu</button>
    </div>

    <div id="podium" class="screen hidden">
      <h2>CLASSEMENT</h2>
      <ol id="podium-list"></ol>
      <button id="btn-podium-back" class="big">Retour au salon</button>
    </div>

    <div id="gallery" class="screen hidden">
      <div class="gallery-head">
        <button id="btn-back" class="small">← Menu</button>
        <h2>GALERIE</h2>
        <label class="level">Niveau
          <input type="range" id="gallery-level" min="0" max="8" value="0">
          <span id="gallery-level-val">1</span>
        </label>
      </div>
      <div id="gallery-filters"></div>
      <div id="gallery-grid"></div>
    </div>

    <div id="gameover" class="screen hidden">
      <h2>GAME OVER</h2>
      <p id="final-score" class="score"></p>
      <p id="best-score" class="tag light"></p>
      <button id="btn-retry" class="big">Rejouer</button>
      <button id="btn-menu">Menu</button>
    </div>
  </div>

  <script src="js/config.js?v=2026.10.02-7"></script>
  <script src="js/audio.js?v=2026.10.02-7"></script>
  <script src="js/musique.js?v=2026.10.02-7"></script>
  <script src="js/input.js?v=2026.10.02-7"></script>
  <script src="js/voice.js?v=2026.10.02-7"></script>
  <script src="js/engine.js?v=2026.10.02-7"></script>
  <script src="js/sprites.js?v=2026.10.02-7"></script>
  <script src="js/consigne.js?v=2026.10.02-7"></script>
  <!-- tous les mini-jeux (voir la liste dans ce fichier) -->
  <script src="js/games/liste.js?v=2026.10.02-7"></script>
  <script src="js/fantomes.js?v=2026.10.02-7"></script>
  <script src="js/net.js?v=2026.10.02-7"></script>
  <script src="js/main.js?v=2026.10.02-7"></script>
</body>
</html>
